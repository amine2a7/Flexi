# B6 — continuous integration: no deployment, read-only token, secrets generated per run.
# Trivy (when an image is deployed) and the Flutter job (start of mobile) are postponed (decision
# of 2026-10-23).
name: CI

on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'fix/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_owner
          # Throwaway database of the run, never reachable from outside the runner.
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci_owner" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (frozen lockfile, no scripts from dependencies)
        run: pnpm install --frozen-lockfile
      - name: Per-run secrets of the test API
        run: |
          app_password="$(openssl rand -hex 24)"
          session_secret="$(openssl rand -base64 32)"
          data_key="$(openssl rand -base64 32)"
          # Never printed in the logs (securite DC-03).
          echo "::add-mask::$app_password"
          echo "::add-mask::$session_secret"
          echo "::add-mask::$data_key"
          {
            echo "PG_ADMIN_URL=postgresql://ci_owner:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/postgres"
            echo "APP_DB_PASSWORD=$app_password"
            echo "SESSION_SECRET=$session_secret"
            echo "DATA_ENCRYPTION_KEY=$data_key"
          } >> "$GITHUB_ENV"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: API integration tests (PostgreSQL 16)
        run: pnpm --filter @flexipay/api test:integration
      - run: pnpm build

  security:
    name: Secrets, dependencies, static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (whole history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --exit-code 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Blocking threshold of the threat model (SC-10): high and critical (securite DC-01).
      - name: pnpm audit (shipped dependencies)
        run: pnpm audit -P --audit-level=high
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.100.0 \
            semgrep scan --config p/ci --config p/typescript --config p/secrets --error --metrics=off
