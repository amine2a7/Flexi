name: fp_ui
description: "FlexiPay : thème, design tokens et composants (TicketCard, PinPad, Stamp…)."
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.4.0
  fp_core:
    path: ../fp_core
  intl: ^0.20.3
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter_400Regular.ttf
        - asset: fonts/Inter_500Medium.ttf
          weight: 500
        - asset: fonts/Inter_600SemiBold.ttf
          weight: 600
        - asset: fonts/Inter_700Bold.ttf
          weight: 700
        - asset: fonts/Inter_800ExtraBold.ttf
          weight: 800
    - family: BarlowCondensed
      fonts:
        - asset: fonts/BarlowCondensed_600SemiBold.ttf
          weight: 600
        - asset: fonts/BarlowCondensed_700Bold.ttf
          weight: 700
        - asset: fonts/BarlowCondensed_800ExtraBold.ttf
          weight: 800
    - family: IBMPlexSansArabic
      fonts:
        - asset: fonts/IBMPlexSansArabic_400Regular.ttf
        - asset: fonts/IBMPlexSansArabic_600SemiBold.ttf
          weight: 600
        - asset: fonts/IBMPlexSansArabic_700Bold.ttf
          weight: 700
