<head>
<meta charset="utf-8">

<title>FlexiPay · Prototype mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9EDF2;--panel:#FFFFFF;--ink:#0F1B2A;--muted:#5B6878;--line:#E1E6ED;--navy:#0B1D33;--green:#12D68A;--green-d:#087A4C;--green-t:#E3F8EF}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
a{color:#087A4C}a:hover{color:#0B1D33}
button{font-family:inherit}
.app{display:flex;height:100%;min-height:0}
.panel{width:340px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:20px 20px 12px;display:flex;flex-direction:column;gap:4px}
.brand b{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:28px;color:var(--navy);line-height:1}
.brand b i{font-style:normal;color:var(--green-d)}
.brand span{font-size:13px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:4px 16px 8px;padding:4px;border-radius:12px;background:#EEF1F5}
.tabs button{height:38px;border:0;border-radius:9px;background:transparent;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer}
.tabs button[aria-selected=true]{background:#fff;box-shadow:0 1px 3px rgba(11,29,51,.15)}
.list{flex:1;overflow:auto;padding:4px 12px 24px}
.list h3{margin:16px 8px 6px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.item{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 10px;border:0;border-radius:12px;background:transparent;text-align:left;font-size:14px;color:var(--ink);cursor:pointer}
.item:hover{background:#F4F6F9}
.item[aria-current=true]{background:var(--green-t);font-weight:700}
.item .tag{flex:none;min-width:34px;height:24px;padding:0 6px;border-radius:8px;background:var(--navy);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.item .tag.c{background:var(--green-d)}
.item small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.stage{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;position:relative}
.guide{width:min(560px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.guide[hidden]{display:none}
.guide .top{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.guide .top b{color:var(--ink);text-transform:none;letter-spacing:0;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.guide p{margin:0;font-size:14px;line-height:1.45}
.guide .bar{height:4px;border-radius:4px;background:#EEF1F5;overflow:hidden}.guide .bar span{display:block;height:100%;background:var(--green);transition:width .3s}
.guide .row{display:flex;gap:8px}
.gbtn{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer}
.gbtn.p{background:var(--green);border-color:var(--green);color:var(--navy);flex:1}
.gbtn:disabled{opacity:.4;cursor:default}
.x{width:32px;height:32px;border:0;border-radius:10px;background:#EEF1F5;cursor:pointer;font-size:18px;line-height:1;color:var(--ink)}
.holder{position:relative;flex:none}
.phone{position:absolute;left:0;top:0;width:390px;transform-origin:0 0;border-radius:44px;background:#F4F6F9;box-shadow:0 0 0 10px #0B1D33,0 30px 60px rgba(11,29,51,.25);overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.navlayer{position:absolute;left:0;right:0;bottom:0;height:0}
.navlayer nav{position:absolute!important;bottom:0}
.caption{font-size:13px;color:var(--muted);font-weight:600}
.fab{display:none}
@media (max-width:760px){
 .panel{position:fixed;inset:0 auto 0 0;width:min(340px,88vw);z-index:20;transform:translateX(-105%);transition:transform .25s cubic-bezier(.2,0,0,1);box-shadow:0 0 40px rgba(11,29,51,.3)}
 .app.open .panel{transform:none}
 .scrim{display:none;position:fixed;inset:0;background:rgba(11,29,51,.4);z-index:15}
 .app.open .scrim{display:block}
 .stage{padding:0;gap:0;justify-content:flex-start}
 .phone{border-radius:0;box-shadow:none}
 .caption{display:none}
 .guide{position:fixed;left:8px;right:60px;top:8px;width:auto;z-index:10;padding:10px 12px;box-shadow:0 8px 24px rgba(11,29,51,.18)}
 .guide.min p,.guide.min .row{display:none}
 .fab{display:flex;position:fixed;right:8px;top:8px;z-index:12;width:44px;height:44px;padding:0;justify-content:center;border-radius:14px;border:0;background:var(--navy);color:#fff;font-weight:700;font-size:14px;align-items:center;gap:6px;box-shadow:0 8px 20px rgba(11,29,51,.3);cursor:pointer}
}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
@keyframes fp-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fp-stamp{0%{opacity:0;transform:rotate(-10deg) scale(1.8)}60%{opacity:1;transform:rotate(-10deg) scale(.94)}100%{opacity:1;transform:rotate(-10deg) scale(1)}}
@keyframes fp-shake{0%,100%{transform:rotate(-8deg) translateX(0)}25%{transform:rotate(-8deg) translateX(-8px)}50%{transform:rotate(-8deg) translateX(8px)}75%{transform:rotate(-8deg) translateX(-4px)}}
@keyframes fp-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes fp-load{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@keyframes fp-scanline{0%{top:12%}50%{top:84%}100%{top:12%}}
@keyframes fp-sheet{from{transform:translateY(100%)}to{transform:none}}
.fp-rise{animation:fp-rise 320ms cubic-bezier(.2,0,0,1) both}
.fp-d1{animation-delay:60ms}.fp-d2{animation-delay:120ms}.fp-d3{animation-delay:180ms}.fp-d4{animation-delay:240ms}
.fp-stamp{animation:fp-stamp 600ms cubic-bezier(.34,1.56,.64,1) 250ms both}
.fp-shake{animation:fp-shake 420ms ease-in-out 150ms both}
.fp-bob{animation:fp-bob 2.4s ease-in-out infinite}
.fp-load{animation:fp-load 1.2s cubic-bezier(.2,0,0,1) infinite}
.fp-scan{animation:fp-scanline 2.4s ease-in-out infinite}
.fp-sheet{animation:fp-sheet 320ms cubic-bezier(.2,0,0,1) both}
.fp-press{transition:transform 120ms cubic-bezier(.2,0,0,1)}.fp-press:active{transform:scale(.96)}
@media (prefers-reduced-motion: reduce){.fp-rise,.fp-stamp,.fp-shake,.fp-bob,.fp-load,.fp-scan,.fp-sheet{animation:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="scrim" id="scrim"></div>
  <aside class="panel" aria-label="Scénarios et écrans">
    <div class="brand"><b>Flexi<i>Pay</i> · Prototype</b><span>34 écrans · 22 scénarios · cliquez dans l’app comme sur un vrai téléphone</span></div>

    <div class="holder" id="holder">
      <div class="phone" id="phone"><div class="screen" id="screen"></div><div class="navlayer" id="navlayer"></div></div>
    </div>
    <div class="caption" id="caption"></div>

  </main>
</div>

<script>FP.cls["M-Onboarding"] = function (DCLogic) {

    ];
    const s = this.state.s;
    return {
      ...steps[s],
      s0: s === 0, s1: s === 1, s2: s === 2,
      last: s === 2, notLast: s < 2,
      next: () => this.setState({ s: Math.min(2, s + 1) }),

    };
  }
}

<script>FP.cls["M-CreerPin"] = function (DCLogic) {
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pin: '' }; }
  renderVals() {
    const pin = this.state.pin;
    const add = (d) => () => { if (this.state.pin.length < 4) this.setState({ pin: this.state.pin + d }); };
    const keys = ['1','2','3','4','5','6','7','8','9','bio','0','del'].map((k) => ({
      label: k,
      isNum: k !== 'bio' && k !== 'del',
      isBio: k === 'bio',
      isDel: k === 'del',
      aria: k === 'bio' ? 'Utiliser mon empreinte' : (k === 'del' ? 'Effacer' : k),
      bg: (k === 'bio' || k === 'del') ? 'transparent' : '#FFFFFF',
      border: (k === 'bio' || k === 'del') ? '0' : '1px solid #E1E6ED',
      press: k === 'del' ? () => this.setState({ pin: this.state.pin.slice(0, -1) }) : (k === 'bio' ? () => this.setState({ pin: '0000' }) : add(k))
    }));
    const dots = [0, 1, 2, 3].map((i) => ({ bg: i < pin.length ? '#0B1D33' : 'transparent' }));
    return { keys, dots, full: pin.length === 4, notFull: pin.length < 4 };
  }
}
return Component; };</script>

      { name: 'Restaurant El Medina', kind: 'Restaurant', city: 'Tunis', dist: '4,5 km', initials: 'EM', types: ['rest'] }

    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      const f = finder(r, c);
      const on = f === -1 ? ((r * 7 + c * 13 + r * c * 3) % 5 < 2) : f === 1;
      cells.push({ fill: on ? '#0B1D33' : '#FFFFFF' });
    }
    return cells;
  }
  renderVals() {
    const list = [{ name: 'Restauration', amount: '142,500', color: '#14A06A' }, { name: 'Carburant', amount: '40,000', color: '#D9761A' }];
    const sel = this.state.sel, left = this.state.left;
    if (!this.qr) this.qr = this.buildQr();
    return {
      types: list.map((t, i) => ({ ...t, on: i === sel ? 'true' : 'false', border: i === sel ? t.color : '#E1E6ED', pick: () => this.setState({ sel: i }) })),
      qr: this.qr, activeName: list[sel].name, activeColor: list[sel].color,
      secs: String(left).padStart(2, '0'), pct: Math.round(left / 60 * 100) + '%', barColor: left <= 10 ? '#C2362B' : '#12D68A'
    };
  }
}
return Component; };</script>

<script>FP.cls["M-ConfirmPin"] = function (DCLogic) {

<script>FP.cls["M-Profil"] = function (DCLogic) {

<script>FP.cls["M-Aide"] = function (DCLogic) {
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { open: 0 }; }
  renderVals() {
    const qs = [
      { q: 'Comment payer chez un commerçant ?', a: 'Touchez le bouton vert Payer, choisissez le type de crédit et montrez le ticket au caissier. Confirmez ensuite avec votre PIN.' },
      { q: 'Pourquoi mon paiement est refusé ?', a: 'Le commerce n’accepte peut-être pas ce type de crédit, votre solde est trop bas, ou le code a expiré. Le motif exact s’affiche à l’écran.' },
      { q: 'Qui recharge mon crédit ?', a: 'Votre entreprise. Vous recevez une notification à chaque nouveau crédit.' },
      { q: 'J’ai oublié mon PIN', a: 'Connectez-vous avec votre e-mail et votre mot de passe, puis créez un nouveau PIN dans Profil.' }
    ];
    return { qs: qs.map((x, i) => ({ ...x, isOpen: i === this.state.open, exp: i === this.state.open ? 'true' : 'false', sign: i === this.state.open ? '−' : '+', toggle: () => this.setState({ open: this.state.open === i ? -1 : i }) })) };
  }
}
return Component; };</script>

        else n.setAttribute(a.name, interp(v, scope));
      }
      proc(n, scope);
    }
  }
  function render() {
    pending = false;
    if (!inst) return;
    const top = screenEl.scrollTop;
    const frag = document.getElementById('t-' + cur).content.cloneNode(true);
    proc(frag, inst.renderVals() || {});
    const nav = frag.querySelector('nav[aria-label]');
    screenEl.replaceChildren(frag);
    navLayer.replaceChildren();
    if (nav && nav.style.position === 'absolute') navLayer.appendChild(nav);
    screenEl.scrollTop = top;
  }
  function schedule() { if (!pending) { pending = true; requestAnimationFrame(render); } }

  function go(name, props, keepScen) {
    if (!FP.cls[name]) return;
    if (inst && inst.componentWillUnmount) inst.componentWillUnmount();
    const meta = D.screens[name];
    cur = name;
    inst = new (getCls(name))(Object.assign({}, meta.defaults, props || {}));
    pending = true; render(); screenEl.scrollTop = 0;
    if (inst.componentDidMount) inst.componentDidMount();
    $('caption').textContent = meta.label;
    if (!keepScen && scen) {
      const i = scen.steps.findIndex((s) => s.s === name);
      if (i >= 0) { step = i; paintGuide(); }
    }
    try { history.replaceState(null, '', '#' + name); } catch (e) {}
    paintList();
  }

  // links inside the app
  phone.addEventListener('click', (e) => {
    const a = e.target.closest('a[href]');
    if (!a) return;
    const h = a.getAttribute('href');
    e.preventDefault();
    const m = h.match(/([\w-]+)\.dc\.html$/);
    if (m) go(m[1]);
  });

  // scenario guide
  function startScen(s) { scen = s; step = 0; $('guide').hidden = false; $('guide').classList.remove('min'); goStep(); closeDrawer(); }
  function goStep() { const st = scen.steps[step]; go(st.s, st.props, true); paintGuide(); }
  function paintGuide() {
    if (!scen) { $('guide').hidden = true; return; }
    const st = scen.steps[step];
    $('g-id').textContent = scen.id; $('g-title').textContent = scen.title;
    $('g-count').textContent = (step + 1) + '/' + scen.steps.length;
    $('g-text').textContent = st.txt;
    $('g-bar').style.width = ((step + 1) / scen.steps.length * 100) + '%';
    $('g-prev').disabled = step === 0;
    $('g-next').textContent = step === scen.steps.length - 1 ? 'Terminer' : 'Étape suivante';
  }
  $('g-prev').onclick = () => { if (step > 0) { step--; goStep(); } };
  $('g-next').onclick = () => { if (step < scen.steps.length - 1) { step++; goStep(); } else { scen = null; paintGuide(); paintList(); } };
  $('g-quit').onclick = () => { scen = null; paintGuide(); paintList(); };
  $('g-min').onclick = () => $('guide').classList.toggle('min');

  // side list
  function paintList() {
    const L = $('list'); L.replaceChildren();
    if (tab === 's') {
      let g = null;
      D.scen.forEach((s) => {
        if (s.group !== g) { g = s.group; const h = document.createElement('h3'); h.textContent = g; L.appendChild(h); }
        const b = document.createElement('button'); b.className = 'item';
        b.setAttribute('aria-current', scen && scen.id === s.id ? 'true' : 'false');
        b.innerHTML = '<span class="tag' + (s.id[0] === 'C' ? ' c' : '') + '"></span><span><span class="t"></span><small></small></span>';
        b.querySelector('.tag').textContent = s.id;
        b.querySelector('.t').textContent = s.title;
        b.querySelector('small').textContent = s.steps.length + ' étape' + (s.steps.length > 1 ? 's' : '');
        b.onclick = () => startScen(s);
        L.appendChild(b);
      });
    } else {
      D.groups.forEach((g) => {
        const h = document.createElement('h3'); h.textContent = g.title; L.appendChild(h);
        g.items.forEach((n) => {
          const b = document.createElement('button'); b.className = 'item';
          b.setAttribute('aria-current', n === cur ? 'true' : 'false');
          b.textContent = D.screens[n].label.replace(/^(Bénéficiaire|Pro) · /, '');
          b.onclick = () => { scen = null; paintGuide(); go(n); closeDrawer(); };
          L.appendChild(b);
        });
      });
    }
  }
  function setTab(t) { tab = t; $('tab-s').setAttribute('aria-selected', t === 's'); $('tab-e').setAttribute('aria-selected', t === 'e'); paintList(); }
  $('tab-s').onclick = () => setTab('s'); $('tab-e').onclick = () => setTab('e');
  function closeDrawer() { $('app').classList.remove('open'); }
  $('fab').onclick = () => $('app').classList.add('open');
  $('scrim').onclick = closeDrawer;

  // sizing
  function fit() {
    const mobile = innerWidth <= 760;
    let s, h;
    if (mobile) { s = innerWidth / 390; h = innerHeight / s; }
    else { h = 844; s = Math.min(1, (innerHeight - 200) / 844, (innerWidth - 400) / 410); s = Math.max(s, 0.5); }
    phone.style.height = h + 'px';
    phone.style.transform = 'scale(' + s + ')';
    holder.style.width = (390 * s) + 'px';
    holder.style.height = (h * s) + 'px';
  }
  addEventListener('resize', fit); fit();

  const start = (location.hash || '').slice(1);
  go(FP.cls[start] ? start : 'M-Splash');
  paintList();
})();
</script>
</body>
</html>
