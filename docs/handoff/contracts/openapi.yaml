          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:flexipay:problem:not-found
            title: Not found
            status: 404
            code: NOT_FOUND
            messageKey: errors.notFound
            requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
    Conflict:
      description: Requête idempotente encore en cours, ou état de la ressource incompatible.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/IdempotencyInProgressProblem'
              - $ref: '#/components/schemas/Problem'
          examples:
            idempotencyInProgress:
              value:
                type: urn:flexipay:problem:idempotency-request-in-progress
                title: Idempotent request in progress
                status: 409
                code: IDEMPOTENCY_REQUEST_IN_PROGRESS
                messageKey: errors.idempotencyRequestInProgress
                requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
                details:
                  retryAfterSeconds: 1
            resourceStateConflict:
              value:
                type: urn:flexipay:problem:resource-state-conflict
                title: Resource state conflict
                status: 409
                code: RESOURCE_STATE_CONFLICT
                messageKey: errors.resourceStateConflict
                requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
    PayloadTooLarge:
      description: Corps de requête trop volumineux.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Type de contenu non pris en charge (seul `application/json` est accepté).
      headers:
