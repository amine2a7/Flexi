          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableFinancial:
      description: |
        Refus métier d'une opération financière, **sans aucune écriture au ledger** : solde
        insuffisant ou plafond dépassé (au payeur), paiement refusé sans raison (au commerçant), ou
        clé d'idempotence réutilisée avec un contenu différent.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/InsufficientFundsProblem'
              - $ref: '#/components/schemas/LimitExceededProblem'
              - $ref: '#/components/schemas/Problem'
          examples:
            insufficientFunds:
              summary: E7 — solde 30 000, paiement 45 000 (réponse au payeur)
              value:
                type: urn:flexipay:problem:insufficient-funds
                title: Insufficient funds
                status: 422
                code: INSUFFICIENT_FUNDS
                messageKey: errors.insufficientFunds
                requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
                details:
                  missingMillimes: 15000
            limitExceeded:
              summary: E8 — plafond jour 100 000, déjà 80 000, paiement 30 000
              value:
                type: urn:flexipay:problem:limit-exceeded
                title: Limit exceeded
                status: 422
                code: LIMIT_EXCEEDED
                messageKey: errors.limitExceeded
                requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
                details:
                  limitType: DAILY
                  remainingMillimes: 20000
            familyMemberLimitExceeded:
              summary: E16 — limite membre 20 000, rien de consommé, paiement 25 000 (réponse au membre famille)
              value:
                type: urn:flexipay:problem:limit-exceeded
                title: Limit exceeded
                status: 422
                code: LIMIT_EXCEEDED
                messageKey: errors.limitExceeded
                requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
                details:
                  limitType: FAMILY_MEMBER
                  remainingMillimes: 20000
            familyMemberInsufficientFunds:
              summary: Solde de l'employé insuffisant (réponse au membre famille, aucun montant)
              value:
                type: urn:flexipay:problem:insufficient-funds
                title: Insufficient funds
                status: 422
                code: INSUFFICIENT_FUNDS
                messageKey: errors.insufficientFunds
                requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
            paymentDeclined:
              summary: Réponse au commerçant, quelle que soit la raison du refus
              value:
                type: urn:flexipay:problem:payment-declined
                title: Payment declined
                status: 422
                code: PAYMENT_DECLINED
                messageKey: errors.paymentDeclined
                requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
            idempotencyKeyReused:
              value:
                type: urn:flexipay:problem:idempotency-key-reused
                title: Idempotency key reused
                status: 422
                code: IDEMPOTENCY_KEY_REUSED
                messageKey: errors.idempotencyKeyReused
                requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
