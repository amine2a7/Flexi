    # ---------------------------------------------------------------- statuts métier (provisoires)
    CreditType:
      title: CreditType
      description: |
        Type de crédit (décision du 2026-10-13) : Restauration, Habillement, Carburant, Cadeaux.
        Chaque compte (entreprise, bénéficiaire) a un **solde séparé par type** ; un total n'est
        donné qu'à titre d'information. **Aucun transfert ni paiement entre types** : un paiement
        débite le solde du type accepté par le commerçant, sinon `422 INSUFFICIENT_FUNDS`.
      type: string
      enum: [RESTAURATION, HABILLEMENT, CARBURANT, CADEAUX]
    CreditTypeAmount:
      title: CreditTypeAmount
      description: Montant d'un type de crédit (répartition par type, lignes de commande).
      type: object
      additionalProperties: false
      required: [creditType, amountMillimes]
      properties:
        creditType:
          $ref: '#/components/schemas/CreditType'
        amountMillimes:
          $ref: '#/components/schemas/AmountMillimes'
    CreditOrderLine:
      title: CreditOrderLine
      type: object
      additionalProperties: false
      required: [creditType, amountMillimes]
      properties:
        creditType:
          $ref: '#/components/schemas/CreditType'
        amountMillimes:
          $ref: '#/components/schemas/PositiveAmountMillimes'
    CreditTypeSettings:
      title: CreditTypeSettings
      description: Paramétrage d'un type de crédit (règle 6 de la décision du 2026-10-13).
      type: object
      additionalProperties: false
      required: [creditType, enabled, commissionRateBps, validityMonths, dailyLimitMillimes]
      properties:
        creditType:
          $ref: '#/components/schemas/CreditType'
        enabled:
          description: Un type désactivé ne peut plus être commandé, attribué ni payé.
          type: boolean
        commissionRateBps:
          description: Taux de commission prélevé sur les paiements de ce type.
          $ref: '#/components/schemas/RateBps'
        validityMonths:
          description: Durée de validité des crédits de ce type.
          type: integer
          format: int32
          minimum: 1
          maximum: 60
        dailyLimitMillimes:
          description: Plafond de dépense journalier d'un bénéficiaire pour ce type.
          $ref: '#/components/schemas/PositiveAmountMillimes'
    AccountStatus:
      title: AccountStatus
      description: |
        Compte (cahier §8) — En attente KYC, Validé, Rejeté, Suspendu. Un compte reste **inactif**
        (aucune opération métier) tant que son dossier KYC n'est pas validé (`APPROVED`).
      type: string
      enum: [PENDING_KYC, APPROVED, REJECTED, SUSPENDED]
    OrderStatus:
      title: OrderStatus
      description: |
        Commande de crédits — En attente de confirmation (par l'administrateur), En attente de
        paiement (virement à déclarer par l'entreprise), En attente de validation (virement déclaré,
        à vérifier par l'administrateur), Validée (crédits ajoutés au solde), Refusée, Annulée.
      type: string
      enum: [AWAITING_CONFIRMATION, AWAITING_PAYMENT, AWAITING_VALIDATION, VALIDATED, REFUSED, CANCELLED]
    PaymentStatus:
      title: PaymentStatus
      description: Paiement — Initié, Confirmé, Réglé, Refusé, En litige (cahier v4.1 §8).
      type: string
      enum: [INITIATED, CONFIRMED, SETTLED, REFUSED, DISPUTED, REFUNDED]
    PayoutRequestStatus:
      title: PayoutRequestStatus
      description: Demande de virement — Demandée, Contrôlée, Envoyée, Exécutée, Rejetée.
      type: string
      enum: [REQUESTED, CHECKED, SENT, EXECUTED, REJECTED, ON_HOLD]
    ApprovalStatus:
      title: ApprovalStatus
      description: Approbation (double validation, approbateur ≠ initiateur) — En attente, Approuvée, Refusée.
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    CreditBatchStatus:
      title: CreditBatchStatus
      description: |
        Lot de crédits — Actif, Expiré (glossaire, DP n° 14). Calculé par le serveur en
        `Africa/Tunis` (E10) ; le client ne compare jamais une date d'expiration à l'heure locale.
      type: string
      enum: [ACTIVE, EXPIRED]
    FraudAlertStatus:
      title: FraudAlertStatus
      description: Alerte antifraude — Ouverte, En cours, Close (clôture motivée et journalisée, DP n° 14).
      type: string
      enum: [OPEN, IN_PROGRESS, CLOSED]
