          maxLength: 120
        dueAt:
          description: Échéance cible de la décision (15 jours).
          $ref: '#/components/schemas/Timestamp'
        decisionReason:
          oneOf:
            - type: string
              maxLength: 500
            - type: 'null'
        decidedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    DisputeDetail:
      title: DisputeDetail
      allOf:
        - $ref: '#/components/schemas/Dispute'
        - type: object
          required: [notes]
          properties:
            notes:
              type: array
              maxItems: 500
              items:
                $ref: '#/components/schemas/DisputeNote'
    DisputeNote:
      title: DisputeNote
      type: object
      additionalProperties: false
      required: [id, authorName, text, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        authorName:
          type: string
          maxLength: 120
        text:
          type: string
          maxLength: 2000
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    DisputeOpen:
      title: DisputeOpen
      type: object
      additionalProperties: false
      required: [paymentId, reason]
      properties:
        paymentId:
          $ref: '#/components/schemas/Uuid'
        reason:
          type: string
          minLength: 10
          maxLength: 500
    DisputeNoteCreate:
      title: DisputeNoteCreate
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
    DisputePage:
      title: DisputePage
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Dispute'
        page:
          $ref: '#/components/schemas/PageInfo'
    Problem:
      title: Problem
      description: |
        Erreur **sans détails** (aucun membre `details`, aucun membre supplémentaire). Seules les
        variantes typées (`ValidationProblem`, `InsufficientFundsProblem`, `LimitExceededProblem`,
        `RateLimitedProblem`, `IdempotencyInProgressProblem`, `ServiceUnavailableProblem`)
        déclarent un `details`, avec un schéma fermé.
      allOf:
        - $ref: '#/components/schemas/ProblemBase'
      unevaluatedProperties: false
    FieldErrorCode:
      title: FieldErrorCode
      description: Motif d'invalidité d'un champ. Liste extensible.
      type: string
      enum:
        - REQUIRED
        - INVALID_TYPE
        - INVALID_FORMAT
        - INVALID_ENUM
        - NOT_INTEGER
        - TOO_SMALL
        - TOO_BIG
        - TOO_SHORT
        - TOO_LONG
        - UNKNOWN_FIELD
        - INVALID_CURSOR
        - CURRENT_PASSWORD_INVALID
        - PASSWORD_POLICY_VIOLATION
        - IN_FUTURE
        - GRID_OVERLAP
        - GRID_DEFAULT_REQUIRED
        - GRID_DEFAULT_DUPLICATE
        - GRID_BOUNDS
    FieldError:
      title: FieldError
      type: object
      additionalProperties: false
      required: [in, pointer, code, messageKey]
      properties:
        in:
          type: string
          enum: [body, query, path, header]
        pointer:
          description: JSON Pointer (RFC 6901) pour `body`, ex. `/amountMillimes` ; nom du paramètre sinon.
          type: string
          maxLength: 256
        code:
          $ref: '#/components/schemas/FieldErrorCode'
        messageKey:
          description: Clé i18n, ex. `errors.field.tooSmall`.
          type: string
          pattern: '^errors\.field\.[a-z][A-Za-z0-9]*$'
        params:
          description: 'Paramètres de la règle (ex. `{"min": 1}`). Jamais la valeur saisie.'
          type: object
          additionalProperties:
            type: [integer, string]
    ValidationProblem:
      title: ValidationProblem
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/ProblemBase'
        - type: object
          required: [details]
          properties:
            code:
              const: VALIDATION_FAILED
            details:
              type: object
              additionalProperties: false
              required: [fields]
              properties:
                fields:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/FieldError'
    InsufficientFundsProblem:
      title: InsufficientFundsProblem
      unevaluatedProperties: false
      description: |
        Solde insuffisant (E7). Code réservé au **payeur** (le commerçant reçoit
        `PAYMENT_DECLINED`). Employé titulaire du wallet : `details.missingMillimes` toujours
        présent. Membre famille (refus dû au solde de l'employé) : **aucun** `details`, aucun
        montant. `details` est donc facultatif dans le schéma. Jamais de solde disponible ni de
        montant requis.
      allOf:
        - $ref: '#/components/schemas/ProblemBase'
        - type: object
          properties:
            code:
              const: INSUFFICIENT_FUNDS
            details:
              type: object
              additionalProperties: false
              required: [missingMillimes]
              properties:
                missingMillimes:
                  $ref: '#/components/schemas/PositiveAmountMillimes'
    LimitType:
      title: LimitType
      description: Plafond atteint (RG-4, spec 02 §5). Liste extensible.
      type: string
      enum: [TRANSACTION, DAILY, MONTHLY, FAMILY_MEMBER]
    LimitExceededProblem:
      title: LimitExceededProblem
      unevaluatedProperties: false
      description: |
        Plafond dépassé (E8, E16). Même règle d'exposition que `INSUFFICIENT_FUNDS` : réservé au
        payeur ; le commerçant reçoit `PAYMENT_DECLINED`. Membre famille : `limitType`
        `FAMILY_MEMBER` et `remainingMillimes` = reste de **sa propre limite**, jamais un montant
        lié au solde ou aux plafonds de l'employé.
      allOf:
        - $ref: '#/components/schemas/ProblemBase'
        - type: object
          properties:
            code:
              const: LIMIT_EXCEEDED
            details:
              type: object
              additionalProperties: false
              required: [limitType, remainingMillimes]
              properties:
                limitType:
                  $ref: '#/components/schemas/LimitType'
                remainingMillimes:
                  $ref: '#/components/schemas/AmountMillimes'
    PinRefusedProblem:
      title: PinRefusedProblem
      description: PIN refusé pendant un blocage (`PIN_LOCKED` n'est plus émis, même réponse que PIN faux).
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/ProblemBase'
        - type: object
          required: [details]
          properties:
            code:
              const: PIN_INVALID
            details:
              type: object
              additionalProperties: false
              properties:
                retryAfterSeconds:
                  type: integer
                  minimum: 1
                reauthenticationRequired:
                  type: boolean
    RetryAfterDetails:
      title: RetryAfterDetails
      type: object
      additionalProperties: false
      required: [retryAfterSeconds]
      properties:
        retryAfterSeconds:
          type: integer
          minimum: 1
    RateLimitedProblem:
      title: RateLimitedProblem
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/ProblemBase'
        - type: object
          required: [details]
          properties:
            code:
              const: RATE_LIMITED
            details:
              $ref: '#/components/schemas/RetryAfterDetails'
    IdempotencyInProgressProblem:
      title: IdempotencyInProgressProblem
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/ProblemBase'
        - type: object
          required: [details]
          properties:
            code:
              const: IDEMPOTENCY_REQUEST_IN_PROGRESS
            details:
              $ref: '#/components/schemas/RetryAfterDetails'
    ServiceUnavailableProblem:
      title: ServiceUnavailableProblem
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/ProblemBase'
        - type: object
          properties:
            code:
              const: SERVICE_UNAVAILABLE
            details:
              $ref: '#/components/schemas/RetryAfterDetails'
  responses:
    SessionEstablished:
      description: |
        Session ouverte, renouvelée ou passée à l'état suivant (§10) : cookies posés (web),
        identifiant de session et `csrfToken` renouvelés, `nextStep` = état courant.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control-No-Store'
        Set-Cookie:
          $ref: '#/components/headers/Set-Cookie-Session'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionResult'
          example:
            nextStep: NONE
            csrfToken: 3q2-7wEAAAB0ZXN0LWNzcmYtdG9rZW4tZXhhbXBsZQ
            idleTimeoutSeconds: 900
            absoluteExpiresAt: '2026-10-11T16:30:00.000Z'
    # Réponses d'erreur réutilisables. Chaque endpoint métier référence celles qui s'appliquent.
    BadRequest:
      description: Requête invalide (validation, ou en-tête d'idempotence absent ou mal formé).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/ValidationProblem'
              - $ref: '#/components/schemas/Problem'
          examples:
            validation:
              value:
                type: urn:flexipay:problem:validation-failed
                title: Validation failed
                status: 400
                code: VALIDATION_FAILED
                messageKey: errors.validationFailed
                requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
                details:
                  fields:
                    - in: body
                      pointer: /amountMillimes
                      code: NOT_INTEGER
                      messageKey: errors.field.notInteger
            idempotencyKeyRequired:
              value:
                type: urn:flexipay:problem:idempotency-key-required
                title: Idempotency key required
                status: 400
                code: IDEMPOTENCY_KEY_REQUIRED
                messageKey: errors.idempotencyKeyRequired
                requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
    Unauthorized:
      description: Non authentifié, session expirée, identifiants ou code MFA refusés (message générique).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        WWW-Authenticate:
          $ref: '#/components/headers/WWW-Authenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unauthenticated:
              value:
                type: urn:flexipay:problem:unauthenticated
                title: Unauthenticated
                status: 401
                code: UNAUTHENTICATED
                messageKey: errors.unauthenticated
                requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
            sessionExpired:
              value:
                type: urn:flexipay:problem:session-expired
                title: Session expired
                status: 401
                code: SESSION_EXPIRED
                messageKey: errors.sessionExpired
                requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
            invalidCredentials:
              value:
                type: urn:flexipay:problem:invalid-credentials
                title: Invalid credentials
                status: 401
                code: INVALID_CREDENTIALS
                messageKey: errors.invalidCredentials
                requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
            mfaCodeInvalid:
              value:
                type: urn:flexipay:problem:mfa-code-invalid
                title: MFA code invalid
                status: 401
                code: MFA_CODE_INVALID
                messageKey: errors.mfaCodeInvalid
                requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
            mfaChallengeExpired:
              value:
                type: urn:flexipay:problem:mfa-challenge-expired
                title: MFA challenge expired
                status: 401
                code: MFA_CHALLENGE_EXPIRED
                messageKey: errors.mfaChallengeExpired
                requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
    Forbidden:
      description: Rôle insuffisant, mot de passe temporaire à changer, MFA à enrôler, ou jeton CSRF invalide.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            forbidden:
              value:
                type: urn:flexipay:problem:forbidden
                title: Forbidden
                status: 403
                code: FORBIDDEN
                messageKey: errors.forbidden
                requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
            passwordChangeRequired:
              value:
                type: urn:flexipay:problem:password-change-required
                title: Password change required
                status: 403
                code: PASSWORD_CHANGE_REQUIRED
                messageKey: errors.passwordChangeRequired
                requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
            mfaEnrollmentRequired:
              value:
                type: urn:flexipay:problem:mfa-enrollment-required
                title: MFA enrollment required
                status: 403
                code: MFA_ENROLLMENT_REQUIRED
                messageKey: errors.mfaEnrollmentRequired
                requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
            csrfTokenInvalid:
              value:
                type: urn:flexipay:problem:csrf-token-invalid
                title: CSRF token invalid
                status: 403
                code: CSRF_TOKEN_INVALID
                messageKey: errors.csrfTokenInvalid
                requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
    NotFound:
      description: Ressource introuvable **ou appartenant à un autre tenant** (indiscernables).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:flexipay:problem:not-found
            title: Not found
            status: 404
            code: NOT_FOUND
            messageKey: errors.notFound
            requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
    Conflict:
      description: Requête idempotente encore en cours, ou état de la ressource incompatible.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/IdempotencyInProgressProblem'
              - $ref: '#/components/schemas/Problem'
          examples:
            idempotencyInProgress:
              value:
                type: urn:flexipay:problem:idempotency-request-in-progress
                title: Idempotent request in progress
                status: 409
                code: IDEMPOTENCY_REQUEST_IN_PROGRESS
                messageKey: errors.idempotencyRequestInProgress
                requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
                details:
                  retryAfterSeconds: 1
            resourceStateConflict:
              value:
                type: urn:flexipay:problem:resource-state-conflict
                title: Resource state conflict
                status: 409
                code: RESOURCE_STATE_CONFLICT
                messageKey: errors.resourceStateConflict
                requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
    PayloadTooLarge:
      description: Corps de requête trop volumineux.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Type de contenu non pris en charge (seul `application/json` est accepté).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableFinancial:
      description: |
        Refus métier d'une opération financière, **sans aucune écriture au ledger** : solde
        insuffisant ou plafond dépassé (au payeur), paiement refusé sans raison (au commerçant), ou
        clé d'idempotence réutilisée avec un contenu différent.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/InsufficientFundsProblem'
              - $ref: '#/components/schemas/LimitExceededProblem'
              - $ref: '#/components/schemas/Problem'
          examples:
            insufficientFunds:
              summary: E7 — solde 30 000, paiement 45 000 (réponse au payeur)
              value:
                type: urn:flexipay:problem:insufficient-funds
                title: Insufficient funds
                status: 422
                code: INSUFFICIENT_FUNDS
                messageKey: errors.insufficientFunds
                requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
                details:
                  missingMillimes: 15000
            limitExceeded:
              summary: E8 — plafond jour 100 000, déjà 80 000, paiement 30 000
              value:
                type: urn:flexipay:problem:limit-exceeded
                title: Limit exceeded
                status: 422
                code: LIMIT_EXCEEDED
                messageKey: errors.limitExceeded
                requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
                details:
                  limitType: DAILY
                  remainingMillimes: 20000
            familyMemberLimitExceeded:
              summary: E16 — limite membre 20 000, rien de consommé, paiement 25 000 (réponse au membre famille)
              value:
                type: urn:flexipay:problem:limit-exceeded
                title: Limit exceeded
                status: 422
                code: LIMIT_EXCEEDED
                messageKey: errors.limitExceeded
                requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
                details:
                  limitType: FAMILY_MEMBER
                  remainingMillimes: 20000
            familyMemberInsufficientFunds:
              summary: Solde de l'employé insuffisant (réponse au membre famille, aucun montant)
              value:
                type: urn:flexipay:problem:insufficient-funds
                title: Insufficient funds
                status: 422
                code: INSUFFICIENT_FUNDS
                messageKey: errors.insufficientFunds
                requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
            paymentDeclined:
              summary: Réponse au commerçant, quelle que soit la raison du refus
              value:
                type: urn:flexipay:problem:payment-declined
                title: Payment declined
                status: 422
                code: PAYMENT_DECLINED
                messageKey: errors.paymentDeclined
                requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
            idempotencyKeyReused:
              value:
                type: urn:flexipay:problem:idempotency-key-reused
                title: Idempotency key reused
                status: 422
                code: IDEMPOTENCY_KEY_REUSED
                messageKey: errors.idempotencyKeyReused
                requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
    UnprocessableRule:
      description: "Refus d'une règle de gestion (par exemple `LAST_SUPER_ADMIN`, dernier super-administrateur actif)."
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Limite de débit atteinte (par IP, compte ou route).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RateLimitedProblem'
          example:
            type: urn:flexipay:problem:rate-limited
            title: Rate limited
            status: 429
            code: RATE_LIMITED
            messageKey: errors.rateLimited
            requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
            details:
              retryAfterSeconds: 30
    InternalError:
      description: Erreur interne générique (aucun détail technique exposé).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:flexipay:problem:internal-error
            title: Internal error
            status: 500
            code: INTERNAL_ERROR
            messageKey: errors.internal
            requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
    ServiceUnavailable:
      description: Service temporairement indisponible.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ServiceUnavailableProblem'
          example:
            type: urn:flexipay:problem:service-unavailable
            title: Service unavailable
            status: 503
            code: SERVICE_UNAVAILABLE
            messageKey: errors.serviceUnavailable
            requestId: 0192f0c4-6a1e-7c3b-9d2e-5b7a1f0e4c21
