    # ---------------------------------------------------------------- erreurs
    ProblemCode:
      title: ProblemCode
      description: Code d'erreur machine stable (catalogue en section 4). Liste extensible.
      type: string
      enum:
        - VALIDATION_FAILED
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_INVALID
        - UNAUTHENTICATED
        - SESSION_EXPIRED
        - INVALID_CREDENTIALS
        - MFA_CODE_INVALID
        - MFA_CHALLENGE_EXPIRED
        - PASSWORD_CHANGE_REQUIRED
        - MFA_ENROLLMENT_REQUIRED
        - FORBIDDEN
        - CSRF_TOKEN_INVALID
        - NOT_FOUND
        - IDEMPOTENCY_REQUEST_IN_PROGRESS
        - RESOURCE_STATE_CONFLICT
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - IDEMPOTENCY_KEY_REUSED
        - INSUFFICIENT_FUNDS
        - LIMIT_EXCEEDED
        - LAST_SUPER_ADMIN
        - PAYMENT_DECLINED
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - PIN_INVALID
        - PIN_LOCKED
        - COMMISSION_GRID_MISSING
    ProblemBase:
      title: ProblemBase
      description: |
        Membres communs de toute erreur RFC 9457 (`application/problem+json`). Schéma de base
        **non utilisé seul** : il est composé par `Problem` (sans détails) et par les variantes
        typées `*Problem`, chacune **fermée** par `unevaluatedProperties: false`. Les membres RFC
        `detail` et `instance` ne sont jamais envoyés. Aucun texte destiné à l'utilisateur : le
        client traduit `messageKey`.
      type: object
      required: [type, title, status, code, messageKey, requestId]
      properties:
        type:
          description: URN stable dérivée du code, ex. `urn:flexipay:problem:insufficient-funds`.
          type: string
          format: uri
          pattern: '^urn:flexipay:problem:[a-z0-9]+(-[a-z0-9]+)*$'
        title:
          description: Libellé technique anglais fixe par code. Jamais affiché.
          type: string
          maxLength: 100
        status:
          description: Statut HTTP, identique à celui de la réponse.
          type: integer
          minimum: 400
          maximum: 599
        code:
          $ref: '#/components/schemas/ProblemCode'
        messageKey:
          description: Clé i18n du message (`errors.<codeEnCamelCase>`).
          type: string
          pattern: '^errors\.[a-z][A-Za-z0-9]*$'
        requestId:
          description: Identifiant de corrélation, identique à l'en-tête `X-Request-Id`.
          type: string
          format: uuid
    UserStatus:
      title: UserStatus
